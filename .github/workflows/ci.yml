name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift toolchain
        run: swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Run tests
        run: swift test

      - name: Build .app bundle
        run: ./build.sh

      - name: Validate bundled Info.plist
        run: /usr/libexec/PlistBuddy -c "Print" .build/release/ClaudeNotify.app/Contents/Info.plist
